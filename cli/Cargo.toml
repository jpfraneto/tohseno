[package]
name = "tohseno"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-stream = "=0.3.6"
axum = { version = "0.8.6", features = ["json", "query", "tokio"] }
base64.workspace = true
clap.workspace = true
futures-util = "=0.3.31"
libc = "=0.2.189"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
time = { version = "=0.3.36", features = ["formatting", "parsing", "serde"] }
tokio.workspace = true
tokio-util = { version = "0.7.17", features = ["io"] }
tohseno-application = { path = "../application" }
tohseno-companion = { path = "../companion" }
tohseno-engine = { path = "../engine" }
tohseno-node = { path = "../node" }
tohseno-network = { path = "../network" }
tohseno-protocol = { path = "../protocol" }
reqwest.workspace = true
rpassword = "=7.4.0"
sha2 = "=0.10.9"
zeroize = "=1.8.1"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }

[dev-dependencies]
tempfile = "3.15"

[[bin]]
name = "tohseno"
path = "src/main.rs"
