[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"
cbor_metadata = false
deny_warnings = true

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false

