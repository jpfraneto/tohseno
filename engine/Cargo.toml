[package]
name = "tohseno-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "=0.10.3"
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc"] }
base64.workspace = true
# Pin crypto-format helpers to the versions exercised by this candidate.
base64ct = "=1.6.0"
bip32 = { version = "=0.5.3", default-features = false, features = ["secp256k1", "std"] }
bip39 = { version = "=2.1.0", default-features = false, features = ["std", "zeroize"] }
libc = "=0.2.189"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde.workspace = true
serde_json.workspace = true
sha3 = "=0.10.8"
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tohseno-protocol = { path = "../protocol" }
time = { version = "=0.3.36", default-features = false, features = ["formatting"] }
zeroize = { version = "=1.8.1", features = ["derive"] }
zeroize_derive = "=1.4.2"

[dev-dependencies]
p256 = { version = "=0.13.2", features = ["ecdsa"] }
