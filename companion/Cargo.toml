[package]
name = "tohseno-companion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64.workspace = true
bip39 = { version = "=2.1.0", default-features = false, features = ["std", "zeroize"] }
chacha20poly1305 = "=0.10.1"
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
hkdf = "=0.12.4"
hmac = "=0.12.1"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer = "=0.3.2"
sha2 = "=0.10.9"
time = { version = "=0.3.36", default-features = false, features = ["formatting", "parsing"] }
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
zeroize = "=1.8.1"

[dev-dependencies]
tempfile.workspace = true

[[example]]
name = "generate_vectors"
path = "examples/generate_vectors.rs"
