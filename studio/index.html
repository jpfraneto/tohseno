<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TOHSENO Studio</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><img src="/brand/logos/tohseno-core-circle.svg" alt=""><div><h1>TOHSENO</h1><p>History beside your app.</p></div><span id="status">Ready</span></header>
  <main>
    <aside>
      <div class="section-title"><h2>Apps</h2><button id="new-app-button" type="button">New</button></div>
      <div id="apps" class="apps"></div>
    </aside>
    <section class="workspace">
      <form id="new-app" class="card">
        <p class="eyebrow">Initialize</p><h2>Track an app folder</h2>
        <p class="quiet">TOHSENO adds only <code>.tohseno/</code>. Your app remains ordinary files.</p>
        <label>Folder name<input id="app-name" required pattern="[A-Za-z0-9][A-Za-z0-9._-]*" autocomplete="off"></label>
        <button class="primary" type="submit">Initialize app</button>
      </form>
      <div id="selected" hidden>
        <section class="card">
          <p class="eyebrow">App</p><h2 id="selected-name"></h2><p id="folder" class="path"></p>
          <div class="actions"><button id="open-folder" type="button">Open folder</button></div>
        </section>
        <section class="card">
          <p class="eyebrow">Versions</p><h2 id="version-title"></h2>
          <ol id="versions"></ol>
          <form id="record-version">
            <label>Version note <small>Optional</small><textarea id="version-note" rows="4"></textarea></label>
            <button class="primary" type="submit">Record version</button>
          </form>
        </section>
      </div>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
