[workspace]
members = ["engine", "cli", "protocol", "node"]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jpfraneto/tohseno"
rust-version = "1.88"

[workspace.dependencies]
# base64 carries browser-dropped image bytes over the localhost-only JSON intake.
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
# Direct key and bracketed-paste handling keeps terminal UI out of the engine.
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Rustls keeps Studio's server-side Bankr calls independent of the system
# OpenSSL installation. API credentials never enter browser JavaScript.
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
# Temporary directories safely scope Studio's decoded localhost image uploads.
tempfile = "3.15"
tokio = { version = "1.43", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
