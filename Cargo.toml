[workspace]
members = ["engine", "cli", "protocol", "node", "companion", "application", "network"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jpfraneto/tohseno"
rust-version = "1.88"

[workspace.dependencies]
# Portable historical workshop bundles encode file bytes as base64.
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Rustls keeps the release updater independent of the system OpenSSL install.
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Temporary files scope updater downloads and historical bundle verification.
tempfile = "3.15"
tokio = { version = "1.43", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
