<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0b0a">
  <meta name="description" content="An MVP factory for iOS apps. Describe an app, send the intent to your Mac, and install it on your iPhone. Free and open source.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{BRAND}}">
  <meta property="og:title" content="TOHSENO — tohseno create my-app-name">
  <meta property="og:description" content="Describe an app. It gets built on your Mac and installed on your iPhone. Free and open source.">
  <meta property="og:url" content="{{CANONICAL_ORIGIN}}/">
  <meta property="og:image" content="{{OG_IMAGE_URL}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="TOHSENO — one app per day. Yours.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{CANONICAL_ORIGIN}}/">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="preload" href="/fonts/plex-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/landing.css?v={{LANDING_STYLE_REVISION}}">
  <script src="/app.js" type="module"></script>
  <title>TOHSENO — tohseno create my-app-name</title>
</head>
<body>
  <a class="skip-link" href="#terminal-input">Skip to the prompt</a>

  <!-- The whole offer, for a reader or a crawler without JavaScript. With
       JavaScript the page is a prompt and nothing else: every sentence that
       used to sit above it was between a person and the one thing to do. -->
  <noscript>
    <section class="noscript">
      <h1>Describe an app. It gets built, and installed on your iPhone.</h1>
      <p>Then you describe what should change, and the update installs. That is the whole product.</p>
      <p><strong>Free and open source.</strong> It runs on your Mac, on top of the coding harness you already use — Codex or Claude Code. Your machine, your inference, your apps.</p>
      <p>The terminal on this page needs JavaScript. Everything it does is also a command on your Mac:</p>
      <p><code>{{INSTALL_COMMAND}}</code></p>
      <p>Then <code>tohseno create my-app-name</code>, describe the app, and it installs on your iPhone.</p>
    </section>
  </noscript>

  <main class="terminal" id="terminal" data-install-command="{{INSTALL_COMMAND}}">
    <header class="term-bar">
      <svg class="enso" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12.5"></circle></svg>
      <span class="term-brand">{{BRAND}}</span>
      <span class="beta">BETA</span>
    </header>

    <div class="term-screen" id="term-screen">
      <div class="term-stream" id="term-stream"></div>

      <form class="term-form" id="term-form">
        <label class="term-sigil" for="terminal-input" id="term-sigil">$</label>
        <textarea
          id="terminal-input"
          name="line"
          class="term-input"
          rows="1"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="go"
          aria-describedby="term-hint"
          placeholder="tohseno create my-app-name"></textarea>
      </form>
      <p class="term-hint" id="term-hint">Describe your app, attach images, and experience it on your phone. Type help for commands</p>
    </div>

    <nav class="term-status" aria-label="TOHSENO links">
      <a data-link="source" href="{{REPOSITORY_URL}}" rel="noopener">SOURCE</a>
      <a data-link="community" href="https://community.tohseno.com" rel="noopener noreferrer">COMMUNITY</a>
      <a data-link="whitepaper" href="/whitepaper.pdf">WHITEPAPER</a>
      <a data-link="token" href="https://dexscreener.com/robinhood/0x364415f884fc93775a4c1825c1a3af1f0c2d8ba3" target="_blank" rel="noopener noreferrer">$TOHSENO</a>
    </nav>
  </main>

  <div class="drop-veil" id="drop-veil" aria-hidden="true"><span>drop a .md file, or images</span></div>
</body>
</html>
