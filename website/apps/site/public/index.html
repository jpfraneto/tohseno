<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An open-source factory for independent iOS apps — native shots you can run, use, and own in Simulator.">
  <meta name="theme-color" content="#11100e">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{BRAND}}">
  <meta property="og:title" content="Tohseno — Give Every Idea a Shot">
  <meta property="og:description" content="An open-source factory for independent iOS apps — native shots you can run, use, and own in Simulator.">
  <meta property="og:url" content="{{CANONICAL_ORIGIN}}/">
  <meta property="og:image" content="{{OG_IMAGE_URL}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="TOHSENO — Give every idea a shot.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tohseno — Give Every Idea a Shot">
  <meta name="twitter:description" content="An open-source factory for independent iOS apps — native shots you can run, use, and own in Simulator.">
  <meta name="twitter:image" content="{{OG_IMAGE_URL}}">
  <link rel="canonical" href="{{CANONICAL_ORIGIN}}/">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <title>Tohseno — Give Every Idea a Shot</title>
  <link rel="preload" href="/fonts/plex-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/landing.css?v=e9462681cf39">
  <script src="/app.js" defer></script>
</head>
<body>
  <main id="main-content">
    <header class="mast">
      <p class="wordmark"><img src="/logo.svg" alt="" width="26" height="26"><span>TOHSENO</span><span class="beta-tag">BETA</span></p>
      <h1>GIVE EVERY IDEA A <span class="accent">SHOT.</span></h1>
    </header>

    <section class="terminal" aria-label="Get started with TOHSENO in three commands">
      <div class="terminal-bar">
        <span class="terminal-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="terminal-name" aria-hidden="true">tohseno — zsh</span>
      </div>
      <div class="terminal-body" data-terminal>
        <p class="term-comment" data-term-step># install</p>
        <div class="term-row" data-term-step>
          <code class="term-command" id="command-install" data-install-command data-copy-value="{{INSTALL_COMMAND}}"><span class="term-prompt" aria-hidden="true">$ </span><span data-command-text>{{INSTALL_COMMAND}}</span></code>
          <button class="copy-button" type="button" hidden data-copy-command data-copied-label="copied ✓" aria-label="Copy the install command" aria-describedby="command-install">copy</button>
        </div>
        <p class="term-comment" data-term-step># give your idea a shot</p>
        <div class="term-row" data-term-step>
          <code class="term-command" id="command-create" data-copy-value="tohseno create my-app-name"><span class="term-prompt" aria-hidden="true">$ </span><span data-command-text>tohseno create my-app-name</span></code>
          <button class="copy-button" type="button" hidden data-copy-command data-copied-label="copied ✓" aria-label="Copy the create command" aria-describedby="command-create">copy</button>
        </div>
        <p class="term-comment" data-term-step># open the studio</p>
        <div class="term-row" data-term-step>
          <code class="term-command" id="command-studio" data-copy-value="tohseno studio"><span class="term-prompt" aria-hidden="true">$ </span><span data-command-text>tohseno studio</span></code>
          <button class="copy-button" type="button" hidden data-copy-command data-copied-label="copied ✓" aria-label="Copy the studio command" aria-describedby="command-studio">copy</button>
        </div>
        <p class="term-idle" data-term-idle aria-hidden="true"><span class="term-prompt">$ </span><span class="term-cursor"></span></p>
      </div>
    </section>
  </main>

  <footer class="site-links">
    <nav aria-label="More about TOHSENO">
      <a href="{{REPOSITORY_URL}}" rel="noopener">GitHub</a>
      <a href="/docs">Docs</a>
      <a href="/whitepaper.pdf">Whitepaper</a>
      <a href="https://community.tohseno.com" target="_blank" rel="noopener noreferrer">Community</a>
      <a href="/privacy">Privacy</a>
    </nav>
  </footer>
</body>
</html>
