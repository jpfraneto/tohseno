[package]
name = "tohseno-protocol"
version = "0.7.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pure types, byte laws, cryptography, and conformance records for TOHSENO"
publish = false

[dependencies]
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "std"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_json_canonicalizer = "=0.3.2"
sha2 = "=0.10.9"
sha3 = "=0.10.8"
thiserror = "=2.0.17"
time = { version = "=0.3.36", default-features = false, features = ["formatting", "parsing"] }
unicode-normalization = "=0.1.22"

[dev-dependencies]
jsonschema = { version = "=0.49.2", default-features = false }
tempfile = "=3.15.0"

[[example]]
name = "generate_vectors"
path = "examples/generate_vectors.rs"

[[example]]
name = "fascia_commitment"
path = "examples/fascia_commitment.rs"

[[example]]
name = "generate_registry_v2_vectors"
path = "examples/generate_registry_v2_vectors.rs"

[[example]]
name = "generate_public_checkpoint_vectors"
path = "examples/generate_public_checkpoint_vectors.rs"

[[example]]
name = "generate_contract_generation_vectors"
path = "examples/generate_contract_generation_vectors.rs"
